# O Atlantis não aplica a si mesmo (um apply que reinicia o container mataria
# o próprio apply). Quem faz o deploy dele é o GitHub Actions, via OIDC,
# sem nenhuma chave guardada no repositório.
name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlantis-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CONTA: "907079643427"

jobs:
  ci:
    uses: terraform-em-producao/.github/.github/workflows/terraform-ci.yml@v1
    with:
      diretorios: '["."]'

  plan:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.CONTA }}:role/github-atlantis-plan
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false -lockfile=readonly
      - name: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          {
            echo '### Plan do Atlantis'
            echo '```hcl'
            sed -n '/Terraform will perform/,$p' plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    # Só jobs com o environment "producao" conseguem assumir a role de apply (o sub do token inclui o environment).
    environment: producao
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.CONTA }}:role/github-atlantis-apply
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false -lockfile=readonly
      - run: terraform apply -input=false -no-color -lock-timeout=5m -auto-approve
